[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ndirty"
version = "0.1.1"
description = "Offline local image occlusion completion workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "南京大学智能化软件专业241880428沈逸文" }]
dependencies = [
    "PySide6==6.8.3",
    "Pillow==11.0.0",
    "numpy==2.1.3",
    "onnxruntime==1.29.0",
    "rapidocr==3.9.2",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
ndirty = "ndirty.app.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
